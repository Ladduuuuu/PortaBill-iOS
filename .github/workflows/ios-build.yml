name: Build PortaBill iOS
‘on’:
workflow_dispatch:

jobs:
build:
runs-on: macos-15
steps:
- name: Checkout source
uses: actions/checkout@v4

  - name: Install XcodeGen
    run: brew install xcodegen
  - name: Generate Xcode project
    run: xcodegen generate
  - name: List available schemes
    run: xcodebuild -list
