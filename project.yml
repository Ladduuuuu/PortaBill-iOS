# Optional: generate the Xcode project with XcodeGen (https://github.com/yonaskolb/XcodeGen)
#   brew install xcodegen && xcodegen generate && open PortaBill.xcodeproj
name: PortaBill
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  PortaBill:
    type: application
    platform: iOS
    sources:
      - PortaBill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.portabill
        PRODUCT_NAME: PortaBill
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PortaBill
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "PortaBill uses the camera to photograph meters as proof of reading."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "PortaBill saves meter photos to your photo library."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "PortaBill lets you attach an existing photo of a meter."
